training.df_splitted:
  type: pandas.CSVDataset
  filepath: data/03_primary/dataset_splitted.csv

training.time_series_folder:
  type: partitions.PartitionedDataset
  path: data/03_primary/time_series_data/test
  dataset:
    type: pandas.ParquetDataset

training.trained_model_weights:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/weights_trained_model.pt
  artifact_path: models

training.training_history:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/07_model_output/training_history.pkl
  artifact_path: metrics

training.evaluation_plots:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibDataset
    filepath: data/08_reporting/evaluation_plots.png
  artifact_path: plots
  